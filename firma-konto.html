<!doctype html><html lang="de" data-platform-ready="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mo‘s Abo · Firmenkonto</title><link rel="stylesheet" href="assets/member-home.css"><style>main{max-width:740px;margin:auto;padding:26px 22px}section{background:#1b1f18;border:1px solid #c0ab7950;border-radius:18px;padding:24px;margin:24px 0}label{display:block;margin:15px 0}input,select{display:block;width:100%;padding:12px;background:#10130f;color:#f5f0e6;border:1px solid #c0ab7950;border-radius:9px}button{padding:12px 16px;border:0;border-radius:9px;background:#dfbd7b;color:#211c13;margin:8px 8px 8px 0}#companyAccountStatus{color:#dfbd7b}[hidden]{display:none!important}</style></head><body><main><a href="firma.html">← Firmenbereich</a><h1>Dein Firmenkonto.</h1><p>Wähle deinen Bereich und hinterlasse deine Kontaktdaten. Nach Prüfung durch MO wird dein Betrieb freigegeben.</p><section><form id="companyAuthForm"><label>E-Mail<input id="companyEmail" type="email" autocomplete="username" required></label><label>Passwort<input id="companyPassword" type="password" autocomplete="current-password" required></label><button>Anmelden</button><button id="companyRegister" type="button">Firmenkonto erstellen</button></form><div id="companyVerify" hidden><button id="companyVerifySend">Bestätigung senden</button><button id="companyVerifyCheck">E-Mail bestätigt – weiter</button></div><button id="companyAccountLogout" hidden>Abmelden</button></section><section id="companyApplicationPanel" hidden><form id="companyApplication"><label>Bereich<select name="category" required></select></label><label>Branche<select name="branch" required></select></label><label>Firmenname<input name="name" maxlength="120" required></label><label>Firmenanschrift<input name="address" maxlength="250" required></label><label>Ansprechpartner<input name="contactName" maxlength="100" required></label><label>Telefon<input name="phone" type="tel" maxlength="60"></label><label>Firmenlogo<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><button>Zur Freigabe einreichen</button></form></section><p id="companyAccountStatus" role="status"></p><a href="firmen-scanner.html">Zum Kunden-QR-Scanner →</a></main><script type="module" src="assets/company-account.mjs"></script></body></html>
