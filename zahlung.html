<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mo‘s Abo · Zahlungsstatus</title><style>body{margin:0;background:#0c0d10;color:#f5f0e7;font:17px/1.7 system-ui}main{max-width:700px;margin:8vh auto;padding:30px;border:1px solid #d8b47c66;border-radius:20px}h1{font:44px Georgia,serif;color:#e2bc7c}a{color:#e2bc7c}button{padding:14px;font:inherit;border-radius:9px;background:#e2bc7c;border:0} [hidden]{display:none!important}</style><style>[hidden]{display:none!important}.partner-logo{display:block;width:160px;height:110px;object-fit:contain;background:#fff;border-radius:12px;padding:12px;margin:12px 0}.cafe-location-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}.cafe-location{padding:24px;border:1px solid #b99a63;border-radius:20px}#companyBranding,#partnerPublisher{max-width:1000px;margin:30px auto;padding:25px}#companyLogoForm,#publisherForm{display:grid;gap:14px}#adminAccessHelp{padding:20px;border:1px solid #b99a63;border-radius:15px}</style></head><body><main><a href="member.html">← Zu meinem Konto</a><h1>Dein Zahlungsstatus.</h1><p id="moStripeStatus" role="status">Zahlung wird geprüft …</p><a id="moStripeResult" href="member.html" hidden>Zu meinen Angeboten →</a><p><button id="moStripePortal" type="button">Abo verwalten / kündigen</button></p></main><script src="assets/payment-links.js"></script><script type="module">import * as appApi from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import * as authApi from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
import * as funApi from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-functions.js';
const app=appApi.getApps().find(a=>a.name==='[DEFAULT]')||appApi.initializeApp({"apiKey": "AIzaSyDybfM0XPrpohdWvZF8X8xgP3mdCo6OuzI", "authDomain": "mo-fino.firebaseapp.com", "projectId": "mo-fino", "appId": "1:279668714255:web:6ca341d3d6e3a472d5ec7a"}),auth=authApi.getAuth(app),functions=funApi.getFunctions(app,'europe-west3');
const status=document.getElementById('moStripeStatus');
function say(value){if(status)status.textContent=value;for(const message of document.querySelectorAll('[data-stripe-feedback]'))message.textContent=value;}
function failure(e){if(['functions/not-found','functions/unavailable','functions/internal'].includes(e?.code))return 'Die Zahlung ist noch nicht erreichbar. Der Betreiber muss die Stripe-Einrichtung abschließen. Dein Abo wurde nicht freigeschaltet.';return e?.message?.replace(/^Firebase:\s*/,'')||'Die Zahlung konnte nicht gestartet werden. Bitte erneut versuchen.';}
let working=false;
const testLinks=window.moPaymentLinks?.mode==='payment-links-test';
window.moStripeCheckout=async data=>{if(working)return;const user=auth.currentUser;if(!user?.emailVerified){say('Bitte zuerst anmelden und die E-Mail bestätigen.');throw Error('Bitte zuerst anmelden und die E-Mail bestätigen.');}working=true;say(testLinks?'Stripe-Testzahlung wird geöffnet …':'Sicherer Stripe-Checkout wird geöffnet …');try{if(testLinks){const plan=data.plan||(data.category==='carwash'?data.offerId?.match(/__(basic|plus|premium)_v1$/)?.[1]:null),entry=window.moPaymentLinks[data.category]?.[plan];if(!entry)throw Error('Für diesen Tarif ist noch kein Stripe-Testlink hinterlegt.');const url=new URL(entry.url);if(url.origin!=='https://buy.stripe.com'||!/^\/test_[A-Za-z0-9]+$/.test(url.pathname)||url.username||url.password)throw Error('Ungültige Stripe-Testadresse.');if(/^[A-Za-z0-9_-]{1,128}$/.test(user.uid))url.searchParams.set('client_reference_id',user.uid);location.assign(url.href);return}const result=await funApi.httpsCallable(functions,'createStripeCheckout')({...data,termsAccepted:true});const url=new URL(result.data.url);if(url.origin!=='https://checkout.stripe.com')throw Error('Ungültige Zahlungsadresse.');location.assign(url.href);}catch(e){say(failure(e));throw e}finally{working=false}};
for(const [buttonId,termsId,selector] of [['moStripePay','moStripeTerms','input[name="club-plan"]:checked'],['moStripeMemberPay','moStripeMemberTerms','#requestedPlan']]){
 const button=document.getElementById(buttonId);if(!button)continue;const terms=document.getElementById(termsId),feedback=document.createElement('p');feedback.setAttribute('data-stripe-feedback','');feedback.setAttribute('role','status');button.insertAdjacentElement('afterend',feedback);button.disabled=!terms.checked;terms.onchange=()=>{button.disabled=!terms.checked||working};button.onclick=async()=>{if(!terms.checked||working)return;const plan=document.querySelector(selector)?.value;if(!plan){say('Bitte zuerst einen Tarif wählen.');return}const label=button.textContent;button.disabled=true;button.textContent='Zahlung wird geöffnet …';try{await window.moStripeCheckout({category:'coffee',plan})}catch{}finally{button.textContent=label;button.disabled=!terms.checked}};
}
for(const button of document.querySelectorAll('[data-wash-test-plan]')){button.hidden=!testLinks;button.onclick=async()=>{if(working)return;const plan=button.dataset.washTestPlan,entry=window.moPaymentLinks?.carwash?.[plan];if(!entry)return;const price=(entry.priceCents/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});if(!confirm('Stripe-Sandbox: Wasch-Abo für '+price+' pro Monat testen? Es wird kein echtes Guthaben freigeschaltet. Die Abo-Bedingungen findest du unter „AGB“.'))return;button.disabled=true;try{await window.moStripeCheckout({category:'carwash',plan})}catch{}finally{button.disabled=false}};}
if(testLinks){for(const buttonId of ['moStripePay','moStripeMemberPay']){const button=document.getElementById(buttonId);if(button)button.textContent='Gewählten Tarif bei Stripe testen →'}say('Testmodus: Stripe öffnet eine Testzahlung. Die automatische Guthabenfreigabe ist noch nicht aktiviert.');}
document.getElementById('moStripePortal')?.addEventListener('click',async()=>{if(testLinks){say('Für Änderungen an deinem Testabo wende dich bitte an Mo‘s Abo.');return}const c=document.getElementById('moStripeCategory')?.value||new URLSearchParams(location.search).get('bereich');try{const r=await funApi.httpsCallable(functions,'createStripePortal')({category:c});const u=new URL(r.data.url);if(u.origin!=='https://billing.stripe.com')throw Error('Ungültige Verwaltungsadresse.');location.assign(u.href);}catch(e){say(failure(e))}});
if(document.getElementById('moStripeResult')){
 const c=new URLSearchParams(location.search).get('bereich'),valid=['coffee','carwash'].includes(c);let polling=0;
 async function refresh(user){if(!valid){say('Bitte Café oder Autowäsche wählen.');return}if(!user?.emailVerified){say('Bitte mit deinem bestätigten Mo‘s-Abo-Konto anmelden.');return}if(testLinks){say('Die automatische Zahlungsprüfung und Guthabenfreigabe ist noch nicht aktiviert. Ein Testabschluss bei Stripe erzeugt hier kein einlösbares Guthaben.');return}try{const r=await funApi.httpsCallable(functions,'getStripeStatus')({category:c}),s=r.data;if(s.testPaid){say('Testzahlung erfolgreich. Es wurde kein echtes Abo und kein einlösbares Guthaben freigeschaltet.');return}if(s.active){say('Zahlung bestätigt. Dein Abo ist freigeschaltet.');document.getElementById('moStripeResult').href=c==='coffee'?'cafe-kunden.html#app':'autowaschen-kunden.html#kunden';document.getElementById('moStripeResult').hidden=false;location.replace(document.getElementById('moStripeResult').href);return}if(new URLSearchParams(location.search).has('cancelled')){say('Checkout verlassen. Es wurde keine Freischaltung ausgelöst.');return}say('Wir warten auf die bestätigte Stripe-Zahlung. Eine Rückkehr vom Checkout allein schaltet kein Abo frei.');if(polling++<30)setTimeout(()=>{if(auth.currentUser?.uid===user.uid)refresh(user)},2000);else say('Die Bestätigung steht noch aus. Bitte später den Zahlungsstatus erneut öffnen.');}catch(e){say(failure(e))}}
 authApi.onAuthStateChanged(auth,refresh);
}
</script></body></html>
